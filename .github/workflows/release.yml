name: release

# A tag event carries no dependency on any earlier run: a tag can point at a
# commit that never saw a pull request. So the checks run here, on the tagged
# commit, as a prerequisite of building — that is what makes "nothing is
# published unless the checks passed" true rather than hopeful.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: vet and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  canon:
    name: the pinned CLI accepts the embedded canon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # The check the next steps enforce needs the stock CLI's runtime. `gr`
      # itself never runs Node; this is the development-side verification that
      # the canon `gr` embeds is one that CLI accepts.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'

      # The pinned package is derived from the binary's own report rather than
      # copied into this file, so a pin bump in Go needs no edit here. The
      # diagnosis exits non-zero against an empty scratch repository by design
      # while still emitting the full report, so the exit status is ignored and
      # an empty extraction is what fails the step.
      - name: Derive the pinned package from the binary's own report
        id: pin
        run: |
          set -euo pipefail
          # A Git repository, because the diagnosis resolves a project from a
          # worktree root and an ordinary directory has none. Empty and
          # uninitialized on purpose: this reads the pin the binary carries, not
          # anything about a project.
          probe="$(mktemp -d)"
          git -C "${probe}" init --quiet
          report="$(go run ./cmd/gr doctor -json -repo "${probe}" || true)"
          package="$(printf '%s' "${report}" \
            | jq -r '.invocation // ""' \
            | awk '{for (i = 1; i < NF; i++) if ($i == "--yes") { print $(i + 1); exit }}')"
          if [ -z "${package}" ]; then
            echo "could not read the pinned package out of the diagnosis; priming nothing would return this run to a skipped check" >&2
            printf '%s\n' "${report}" >&2
            exit 1
          fi
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "pinned package: ${package}"

      # The check probes the npm cache with --offline so an ordinary `go test`
      # never reaches the network. On a fresh runner that cache is empty, which
      # is exactly how the guarantee would ship unverified.
      - name: Prime the npm cache with the pinned package
        run: npx --yes "${{ steps.pin.outputs.package }}" --version

      # Stated positively on purpose: a gate that only looks for a skip passes
      # when the stream carries no verdict at all — a rename, a build tag, a
      # mistyped pattern — which is the same green-by-omission this exists to
      # remove.
      - name: Require the canon check to have run
        run: |
          set -euo pipefail
          go test -json -run '^TestPinnedCLIAcceptsTheEmbeddedCanon$' ./internal/harness \
            | tee "${RUNNER_TEMP}/canon.jsonl"
          passed="$(jq -rs '[.[] | select(.Test == "TestPinnedCLIAcceptsTheEmbeddedCanon" and .Action == "pass")] | length' "${RUNNER_TEMP}/canon.jsonl")"
          if [ "${passed}" != "1" ]; then
            echo "the canon check did not pass: it reported ${passed} passes, so the canon is unverified" >&2
            jq -rs '[.[] | select(.Test == "TestPinnedCLIAcceptsTheEmbeddedCanon") | .Action] | unique | @csv' "${RUNNER_TEMP}/canon.jsonl" >&2
            exit 1
          fi

  publish:
    name: build and publish
    needs: [test, canon]
    runs-on: ubuntu-latest
    # Building and publishing are one job so the artifacts never leave the
    # runner, and this is the only job that may write.
    permissions:
      contents: write
    env:
      # `contents: write` sets what the token may do; `gh` reads the credential
      # itself. It is the platform's own token, not a stored secret.
      GH_TOKEN: ${{ github.token }}
      # And it needs to know which repository it is talking about. Without this
      # it infers one from the git remote of the working directory, which fails
      # anywhere outside the checkout — including the artifact directory. The
      # first release run died exactly there.
      GH_REPO: ${{ github.repository }}
    steps:
      # Default single-ref, no-tags fetch on purpose: a tag-following fetch that
      # pulled a second tag pointing at this commit would stamp the higher one.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Any untracked file marks the build modified, so a binary built after one
      # is stamped `+dirty` while claiming to be a release. Artifacts are written
      # outside the checkout for the same reason.
      - name: Refuse to build from a modified tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "the work tree is not clean, so every build here would be stamped as modified" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Build every published platform outside the work tree
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/dist"
          mkdir -p "${dist}"
          while IFS= read -r target; do
            goos="${target%/*}"
            goarch="${target#*/}"
            mkdir -p "${dist}/${goos}_${goarch}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build \
                -ldflags "-X github.com/heurema/goalrail/internal/harness.releaseVersion=${GITHUB_REF_NAME}" \
                -o "${dist}/${goos}_${goarch}/gr" \
                ./cmd/gr
          done < <(jq -r '.platforms[] | "\(.os)/\(.arch)"' release/setup/source-lock.json)

      # Read without executing: three of the four platforms cannot run here.
      # Exact equality, because a tree dirtied by anything stamps `<tag>+dirty`,
      # which a prefix match would publish.
      - name: Require every artifact to carry this tag
        run: |
          set -euo pipefail
          for binary in "${RUNNER_TEMP}"/dist/*/gr; do
            stamped="$(go run ./cmd/goalrail-release binary-version --path "${binary}")"
            if [ "${stamped}" != "${GITHUB_REF_NAME}" ]; then
              echo "${binary} reports ${stamped}, not ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            echo "${binary}: ${stamped}"
          done

      # The licence travels with every minimal distribution. The optional setup
      # bundles are assembled separately from exact source pins below.
      - name: Assemble the minimal archives
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/dist"
          for platform in "${dist}"/*/; do
            name="$(basename "${platform}")"
            cp LICENSE "${platform}/LICENSE"
            COPYFILE_DISABLE=1 tar -czf "${dist}/gr_${GITHUB_REF_NAME}_${name}.tar.gz" -C "${platform}" gr LICENSE
          done

      # Build output and verified upstream source archives stay under
      # RUNNER_TEMP. Package lifecycle scripts are never executed: the release
      # tool extracts the exact integrity-pinned npm tarballs itself.
      - name: Build the optional setup archives and release metadata
        run: |
          set -euo pipefail
          go run ./cmd/goalrail-release build \
            --repo . \
            --dist "${RUNNER_TEMP}/dist" \
            --source-cache "${RUNNER_TEMP}/release-sources" \
            --version "${GITHUB_REF_NAME}" \
            > "${RUNNER_TEMP}/release-build.json"
          jq '{release_version, supported_platforms: [.supported_platforms[].platform]}' \
            "${RUNNER_TEMP}/release-build.json"

      - name: Verify every release identity before publication
        run: |
          set -euo pipefail
          go run ./cmd/goalrail-release verify \
            --repo . \
            --dist "${RUNNER_TEMP}/dist" \
            --source-cache "${RUNNER_TEMP}/release-sources" \
            --version "${GITHUB_REF_NAME}"
          cat "${RUNNER_TEMP}/dist/checksums.txt"

      # `gh release create` with assets stages a draft, uploads everything, and
      # publishes last, so a failed upload leaves a draft rather than a partial
      # public release. The refusal below is this workflow's own: release
      # immutability is a repository setting that is not enabled here, so an
      # unconditional delete would remove a good published release.
      - name: Publish the release
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="${RUNNER_TEMP}/dist"
          minimal_archives=("${dist}"/gr_*.tar.gz)
          setup_archives=("${dist}"/goalrail-setup_*.tar.gz)
          setup_manifests=("${dist}"/goalrail-setup_*.manifest.json)
          # Publication happens only after every artifact exists. Counting them
          # here is what makes that a check rather than an assumption.
          if [ "${#minimal_archives[@]}" -ne 4 ] \
            || [ "${#setup_archives[@]}" -ne 4 ] \
            || [ "${#setup_manifests[@]}" -ne 4 ] \
            || [ ! -f "${dist}/current-release.json" ] \
            || [ ! -f "${dist}/checksums.txt" ]; then
            echo "expected four minimal archives, four setup archives, four setup manifests, current metadata, and checksums; found:" >&2
            ls -1 "${dist}" >&2
            exit 1
          fi

          # A read that cannot distinguish "no release yet" from "the read
          # failed" is worse than no read: the first release run turned a git
          # resolution failure into "nothing is published", which is the answer
          # that skips every protection this block exists for.
          if state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>"${RUNNER_TEMP}/release-view.err")"; then
            case "${state}" in
              true)
                echo "removing a leftover draft from an earlier attempt"
                gh release delete "${GITHUB_REF_NAME}" --yes
                ;;
              *)
                echo "a published release already exists for ${GITHUB_REF_NAME}; supersede it with a new tag rather than repairing it in place" >&2
                exit 1
                ;;
            esac
          elif grep -qi 'release not found' "${RUNNER_TEMP}/release-view.err"; then
            echo "no release exists for ${GITHUB_REF_NAME} yet"
          else
            echo "could not read the release state for ${GITHUB_REF_NAME}; refusing to publish blind" >&2
            cat "${RUNNER_TEMP}/release-view.err" >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install: use the minimal archive for a standalone \`gr\`, or the optional setup archive for the exact private Node/OpenSpec planning runtime. Verify every asset against \`checksums.txt\`; \`current-release.json\` carries the bounded machine-readable platform metadata. Every binary here reports \`${GITHUB_REF_NAME}\` from \`gr version\`." \
            "${minimal_archives[@]}" \
            "${setup_archives[@]}" \
            "${setup_manifests[@]}" \
            "${dist}/current-release.json" \
            "${dist}/checksums.txt"

      # The module proxy is what `gr doctor` asks whether a newer release exists,
      # and it discovers a tag late when nobody asks — measured on this repository
      # at minutes to a quarter of an hour. Asking for the new version here is the
      # documented way to collapse that window to about a minute.
      #
      # It runs last and cannot fail the release: the artifacts are already
      # published, and a slow proxy is not a defective release.
      - name: Ask the proxy for this version, so the check stops lagging it
        continue-on-error: true
        run: |
          set -uo pipefail
          module=github.com/heurema/goalrail
          for attempt in 1 2 3; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://proxy.golang.org/${module}/@v/${GITHUB_REF_NAME}.info" || echo 000)"
            echo "ingest attempt ${attempt}: ${code}"
            if [ "${code}" = "200" ]; then
              break
            fi
            sleep 10
          done
          # Requesting the version is what makes the proxy ingest it, but the
          # diagnosis reads @latest — a different answer, with its own sixty
          # second cache. The v0.1.2 release measured the gap: ingest four
          # seconds after publication, @latest following about two minutes
          # later. Asking for @latest too is what this step exists to warm.
          #
          # @latest reports the newest *stable* version, so a prerelease tag can
          # never equal it while a stable release exists. The tag is published
          # either way; only this equality wait is skipped for one.
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "${GITHUB_REF_NAME} is not a plain release tag; @latest will not report it, so there is nothing to wait for"
              exit 0
              ;;
          esac
          # The waits are between attempts, never after the last one: a cached
          # answer can have most of its sixty seconds left when the first
          # request lands, so the final attempt has to fall past that boundary
          # rather than the loop sleeping into it and giving up unasked.
          for wait in 0 20 20 25; do
            [ "${wait}" = "0" ] || sleep "${wait}"
            reported="$(curl -sS --max-time 20 "https://proxy.golang.org/${module}/@latest" 2>/dev/null \
              | sed -n 's/.*"Version":"\([^"]*\)".*/\1/p')"
            echo "latest: ${reported:-none}"
            if [ "${reported}" = "${GITHUB_REF_NAME}" ]; then
              exit 0
            fi
          done
          echo "the proxy has not resolved ${GITHUB_REF_NAME} as latest yet; its own cache expires within about a minute" >&2
