<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Goalrail agent delivery system</title>
  <desc id="description">A product team defines work, an agent moves through context, policy, sandbox, checks, repair, and evidence, then the team reviews the result.</desc>
  <defs>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#536477" />
    </marker>
    <marker id="repair-arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9A5B00" />
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .frame { fill: #FFFFFF; stroke: #C8D1DC; }
      .rule { stroke: #C8D1DC; stroke-width: 1; }
      .ink { fill: #15202B; }
      .muted { fill: #536477; }
      .blue { fill: #0969DA; }
      .amber { fill: #9A5B00; }
      .green { fill: #16833C; }
      .brand { fill: #15202B; font-size: 44px; font-weight: 760; letter-spacing: -1px; }
      .control { fill: #0969DA; font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
      .headline { fill: #15202B; font-size: 18px; font-weight: 680; }
      .copy { fill: #536477; font-size: 13px; }
      .label { fill: #536477; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
      .stage { fill: #15202B; font-size: 12px; font-weight: 730; letter-spacing: .6px; }
      .footer { fill: #536477; font-size: 12px; }
      .rail { stroke: #0969DA; stroke-width: 2; }
      .rail-soft { stroke: #0969DA; stroke-width: 10; opacity: .08; }
      .flow { stroke: #536477; stroke-width: 1.5; stroke-dasharray: 7 7; animation: flow 5s linear infinite; }
      .repair { fill: none; stroke: #9A5B00; stroke-width: 1.5; stroke-dasharray: 5 6; animation: repair 3.4s linear infinite; }
      .run-token { animation: traverse 6.8s cubic-bezier(.2,.72,.2,1) infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
      .p2 { animation-delay: .55s; }
      .p3 { animation-delay: 1.1s; }
      .p4 { animation-delay: 1.65s; }
      .p5 { animation-delay: 2.2s; }
      .result { animation: breathe 2.8s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      @keyframes repair { to { stroke-dashoffset: 44; } }
      @keyframes traverse {
        0%, 4% { opacity: 0; transform: translateX(0); }
        9% { opacity: 1; }
        91% { opacity: 1; }
        100% { opacity: 0; transform: translateX(640px); }
      }
      @keyframes pulse {
        0%, 28% { opacity: 0; transform: scale(.7); }
        42% { opacity: .32; }
        75%, 100% { opacity: 0; transform: scale(1.45); }
      }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .58; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .repair, .run-token, .pulse, .result { animation: none; }
        .run-token { opacity: 1; transform: translateX(320px); }
      }
    </style>
  </defs>

  <rect width="1200" height="620" rx="13" fill="#F6F8FA" />
  <rect x="1" y="1" width="1198" height="618" rx="12" class="frame" />

  <line x1="1" y1="57" x2="1199" y2="57" class="rule" />
  <circle cx="29" cy="29" r="5" fill="#9A5B00" />
  <text x="45" y="34" class="control">GOALRAIL / AGENT DELIVERY</text>
  <text x="1056" y="35" class="label">PILOT OPEN</text>
  <circle cx="1153" cy="31" r="6" fill="#16833C" />
  <circle cx="1153" cy="31" r="11" fill="none" stroke="#16833C" class="pulse" />

  <text x="48" y="116" class="brand">Goalrail</text>
  <text x="49" y="151" class="headline">Agent delivery, kept on track.</text>
  <text x="49" y="177" class="copy">A maintained harness around your team, repository, and workflow.</text>

  <line x1="48" y1="204" x2="1152" y2="204" class="rule" />

  <line x1="230" y1="222" x2="230" y2="472" class="rule" />
  <line x1="970" y1="222" x2="970" y2="472" class="rule" />

  <text x="48" y="244" class="label">PRODUCT TEAM</text>
  <circle cx="82" cy="288" r="15" fill="#0969DA" opacity=".16" />
  <circle cx="82" cy="281" r="5" fill="#0969DA" />
  <path d="M70 300c2-9 22-9 24 0" fill="none" stroke="#0969DA" stroke-width="3" stroke-linecap="round" />
  <circle cx="118" cy="288" r="15" fill="#0969DA" opacity=".16" />
  <circle cx="118" cy="281" r="5" fill="#0969DA" />
  <path d="M106 300c2-9 22-9 24 0" fill="none" stroke="#0969DA" stroke-width="3" stroke-linecap="round" />
  <circle cx="154" cy="288" r="15" fill="#0969DA" opacity=".16" />
  <circle cx="154" cy="281" r="5" fill="#0969DA" />
  <path d="M142 300c2-9 22-9 24 0" fill="none" stroke="#0969DA" stroke-width="3" stroke-linecap="round" />
  <text x="48" y="337" class="stage">DEFINE THE WORK</text>
  <rect x="49" y="356" width="127" height="67" rx="8" fill="#F6F8FA" stroke="#C8D1DC" />
  <line x1="66" y1="375" x2="145" y2="375" class="rule" />
  <line x1="66" y1="389" x2="132" y2="389" class="rule" />
  <path d="M65 405l5 5 10-12" fill="none" stroke="#16833C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="48" y="453" class="copy">intent · priorities</text>

  <text x="260" y="244" class="label">GOALRAIL MAINTAINS THE RAILS</text>
  <line x1="260" y1="266" x2="940" y2="266" class="rail-soft" />
  <line x1="260" y1="266" x2="940" y2="266" class="rail" />
  <text x="271" y="258" class="copy">CONTEXT</text>
  <text x="534" y="258" class="copy">SKILLS + POLICY</text>
  <text x="846" y="258" class="copy">WORKFLOW</text>

  <line x1="260" y1="348" x2="940" y2="348" class="flow" marker-end="url(#arrow-light)" />
  <circle cx="274" cy="348" r="7" fill="#0969DA" class="run-token" />
  <circle cx="274" cy="348" r="13" fill="none" stroke="#0969DA" opacity=".3" class="run-token" />

  <g>
    <circle cx="300" cy="348" r="22" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" />
    <circle cx="300" cy="348" r="28" fill="none" stroke="#0969DA" class="pulse" />
    <path d="M292 337h14l5 5v17h-19z" fill="none" stroke="#0969DA" stroke-width="2" stroke-linejoin="round" />
    <path d="M306 337v6h6M296 349h11M296 354h8" fill="none" stroke="#0969DA" stroke-width="1.5" />
    <text x="300" y="396" text-anchor="middle" class="stage">TASK</text>
  </g>

  <g>
    <circle cx="450" cy="348" r="22" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" />
    <circle cx="450" cy="348" r="28" fill="none" stroke="#0969DA" class="pulse p2" />
    <rect x="439" y="337" width="17" height="20" rx="2" fill="none" stroke="#0969DA" stroke-width="1.7" />
    <path d="M444 332h17v20" fill="none" stroke="#0969DA" stroke-width="1.7" />
    <text x="450" y="396" text-anchor="middle" class="stage">CONTEXT</text>
  </g>

  <g>
    <circle cx="600" cy="348" r="24" fill="#9A5B00" opacity=".13" />
    <circle cx="600" cy="348" r="22" fill="#FFFFFF" stroke="#9A5B00" stroke-width="2" />
    <circle cx="600" cy="348" r="28" fill="none" stroke="#9A5B00" class="pulse p3" />
    <path d="M591 341l9-6 9 6v13l-9 6-9-6z" fill="none" stroke="#9A5B00" stroke-width="2" />
    <circle cx="600" cy="348" r="3" fill="#9A5B00" />
    <text x="600" y="396" text-anchor="middle" class="stage">AGENT WORK</text>
  </g>

  <g>
    <circle cx="750" cy="348" r="22" fill="#FFFFFF" stroke="#16833C" stroke-width="2" />
    <circle cx="750" cy="348" r="28" fill="none" stroke="#16833C" class="pulse p4" />
    <path d="M739 348l7 7 15-17" fill="none" stroke="#16833C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="750" y="396" text-anchor="middle" class="stage">CHECK</text>
  </g>

  <path d="M750 373 C750 430 600 430 600 373" class="repair" marker-end="url(#repair-arrow-light)" />
  <text x="676" y="443" text-anchor="middle" class="label amber">REPAIR LOOP</text>

  <g>
    <circle cx="900" cy="348" r="22" fill="#FFFFFF" stroke="#16833C" stroke-width="2" />
    <circle cx="900" cy="348" r="28" fill="none" stroke="#16833C" class="pulse p5" />
    <rect x="890" y="336" width="20" height="25" rx="2" fill="none" stroke="#16833C" stroke-width="2" />
    <path d="M894 343h12M894 349h12M894 355h8" stroke="#16833C" stroke-width="1.5" />
    <text x="900" y="396" text-anchor="middle" class="stage">EVIDENCE</text>
  </g>

  <line x1="260" y1="462" x2="940" y2="462" class="rail-soft" />
  <line x1="260" y1="462" x2="940" y2="462" class="rail" />
  <text x="271" y="454" class="copy">SANDBOX</text>
  <text x="551" y="454" class="copy">PERMISSIONS</text>
  <text x="843" y="454" class="copy">VERIFICATION</text>

  <text x="997" y="244" class="label">PRODUCT TEAM</text>
  <circle cx="1084" cy="313" r="42" fill="#16833C" opacity=".10" />
  <circle cx="1084" cy="313" r="28" fill="none" stroke="#16833C" stroke-width="2" class="result" />
  <path d="M1069 313l10 10 21-24" fill="none" stroke="#16833C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1084" y="381" text-anchor="middle" class="stage">REVIEW</text>
  <text x="1084" y="404" text-anchor="middle" class="copy">decision · outcome</text>

  <line x1="48" y1="508" x2="1152" y2="508" class="rule" />
  <text x="48" y="543" class="footer">YOUR TEAM OWNS INTENT + REVIEW</text>
  <text x="1152" y="543" text-anchor="end" class="footer">GOALRAIL KEEPS AGENT DELIVERY ON TRACK</text>
  <text x="48" y="577" class="headline">Small team. Maintained harness. Reviewable change.</text>
  <text x="1152" y="577" text-anchor="end" class="control">ONE REAL PROJECT · NARROW PILOT</text>
</svg>
